# Installed as gnome-session@gnome-shell-plus.target.d/gnome-shell-plus.session.conf:
# what the "gnome-shell-plus" gnome-session session runs. Mirrors GNOME's
# gnome-session@gnome.target.d/gnome.session.conf, with the compositor in
# place of org.gnome.Shell@user.service. gnome-session-services.target
# brings the gsd-* daemons (their own units) and the usual session services.
[Unit]
Requires=gnome-session-services.target
Requires=org.gnome.ShellPlus.service
